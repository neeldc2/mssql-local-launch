services:
  sqlserver:
    image: ://microsoft.com
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD:-CachyOS_Sql_2026!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data_failfast:/var/opt/mssql
    # Restart only if it crashes, but not if we manually exit 1 on failure
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      - |
        # 1. Start engine in background so the script can continue to the next line
        /opt/mssql/bin/sqlservr &
        pid=$!

        # 2. Attempt creation with a retry limit
        count=0
        max_retries=30
        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_PASSWORD:-CachyOS_Sql_2026!}" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'lockdb') CREATE DATABASE [lockdb]"
        do
          count=$((count+1))
          if [ $count -gt $max_retries ]; then
            echo "CRITICAL: Database creation failed after $max_retries attempts. Killing engine."
            kill $pid
            exit 1 # This stops the container and reports failure
          fi
          echo "Waiting for SQL Server to boot ($count/$max_retries)..."
          sleep 2
        done

        echo "SUCCESS: 'lockdb' is ready."
        
        # 3. Bring the engine process to the foreground so the container stays alive
        wait $pid

volumes:
  sqlserver_data_failfast:
